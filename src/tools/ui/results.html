<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSearch results</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font-sans, system-ui, sans-serif);
    font-size: var(--font-text-sm-size, 13px);
    line-height: var(--font-text-sm-line-height, 1.4);
    color: var(--color-text-primary, light-dark(#1f2328, #e6edf3));
  }
  #app { padding: 8px; background: var(--color-background-primary, light-dark(#ffffff, #0d1117)); }
  header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px; }
  header .title { font-weight: var(--font-weight-semibold, 600); }
  header .badge { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px;
    border-radius: var(--border-radius-sm, 4px);
    background: var(--color-background-secondary, light-dark(#f6f8fa, #161b22));
    color: var(--color-text-secondary, light-dark(#59636e, #9198a1)); }
  .stat, .muted { color: var(--color-text-secondary, light-dark(#59636e, #9198a1)); }
  header .spacer { flex: 1; }
  .notice { padding: 8px; margin-bottom: 6px; border-radius: var(--border-radius-md, 6px);
    background: var(--color-background-secondary, light-dark(#f6f8fa, #161b22)); }
  .notice.error { color: var(--color-text-danger, light-dark(#d1242f, #f85149)); }
  .scroll { max-height: 480px; overflow: auto;
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#d1d9e0, #3d444d));
    border-radius: var(--border-radius-md, 6px); }
  :root[data-display-mode="fullscreen"] .scroll { max-height: none; }
  table { border-collapse: collapse; width: 100%; font-family: var(--font-mono, ui-monospace, monospace); }
  th, td { text-align: left; padding: 4px 8px; white-space: nowrap; vertical-align: top;
    border-bottom: var(--border-width-regular, 1px) solid var(--color-border-secondary, light-dark(#e3e8ee, #30363d)); }
  th { position: sticky; top: 0; cursor: pointer; user-select: none;
    background: var(--color-background-secondary, light-dark(#f6f8fa, #161b22));
    font-weight: var(--font-weight-semibold, 600); }
  th[aria-sort="ascending"]::after { content: " \25B2"; }
  th[aria-sort="descending"]::after { content: " \25BC"; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--color-background-tertiary, light-dark(#eef1f4, #1c2128)); }
  td.null { color: var(--color-text-tertiary, light-dark(#818b98, #6e7681)); }
  tr.detail pre { margin: 0; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
  h3 { font-size: var(--font-heading-xs-size, 13px); margin: 12px 0 4px; }
  .label { font-size: 11px; font-weight: var(--font-weight-semibold, 600); text-transform: uppercase;
    letter-spacing: .06em; margin: 10px 0 4px;
    color: var(--color-text-secondary, light-dark(#59636e, #9198a1)); }
  button, details summary { font: inherit; cursor: pointer; color: inherit; }
  button { background: var(--color-background-secondary, light-dark(#f6f8fa, #161b22));
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#d1d9e0, #3d444d));
    border-radius: var(--border-radius-sm, 4px); padding: 2px 8px; }
  button[aria-pressed="true"] { background: var(--color-background-inverse, light-dark(#1f2328, #e6edf3));
    color: var(--color-text-inverse, light-dark(#ffffff, #0d1117)); }
  button:disabled { opacity: .6; cursor: default; }
  details.columns { margin-bottom: 6px; }
  details.columns label { margin-right: 10px; white-space: nowrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-bottom: 4px; }
  .chips .name { font-weight: var(--font-weight-semibold, 600); margin-right: 2px; }
  .chip { border-radius: 999px; padding: 1px 8px; }
  .narrative { padding: 8px; white-space: pre-wrap; border-radius: var(--border-radius-md, 6px);
    border: var(--border-width-regular, 1px) solid var(--color-border-secondary, light-dark(#e3e8ee, #30363d)); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border-radius: 999px; padding: 3px 10px; text-align: left; }
  svg.chart { width: 100%; max-width: 640px; display: block; }
  svg.chart .bar { fill: var(--color-text-info, light-dark(#0969da, #4493f8)); }
  svg.chart text { fill: currentColor; font-size: 12px; font-family: var(--font-mono, ui-monospace, monospace); }
</style>
</head>
<body>
<div id="app"><div class="notice">Waiting for tool result…</div></div>
<script>
(function () {
  'use strict';
  var PROTOCOL_VERSION = '2026-01-26';
  var PAYLOAD_VERSION = 1;
  var CELL_MAX = 120;
  var CHIP_MAX_VALUES = 8;
  var CHIP_MAX_COLUMNS = 3;
  var CHART_MAX_BARS = 30;
  var SVG_NS = 'http://www.w3.org/2000/svg';
  // Marks pill text as view-originated so the model does not treat it as cluster data.
  var MESSAGE_PREFIX = '[Follow-up from the OpenSearch results view. Text suggested by the assistant; any data it quotes is untrusted.] ';
  var NUMERIC_TYPES = ['byte', 'short', 'integer', 'int', 'long', 'bigint', 'float', 'double', 'half_float', 'scaled_float', 'decimal', 'unsigned_long'];
  var root = document.documentElement;
  var app = document.getElementById('app');
  var hostContext = {};
  var nextId = 1;
  var pending = {};

  function send(msg) { window.parent.postMessage(Object.assign({ jsonrpc: '2.0' }, msg), '*'); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params || {} });
    });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }

  function el(tag, text, cls) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (cls) node.className = cls;
    return node;
  }
  function svg(tag, attrs, text) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, String(attrs[k])); });
    if (text !== undefined) node.textContent = String(text);
    return node;
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.styles) hostContext.styles = ctx.styles;
    ['theme', 'displayMode', 'availableDisplayModes', 'containerDimensions', 'safeAreaInsets']
      .forEach(function (k) { if (k in ctx) hostContext[k] = ctx[k]; });
    if (hostContext.theme) { root.dataset.theme = hostContext.theme; root.style.colorScheme = hostContext.theme; }
    var vars = hostContext.styles && hostContext.styles.variables;
    if (vars) Object.keys(vars).forEach(function (k) { if (vars[k]) root.style.setProperty(k, vars[k]); });
    root.dataset.displayMode = hostContext.displayMode || 'inline';
    var dims = hostContext.containerDimensions || {};
    root.style.height = dims.height ? dims.height + 'px' : '';
    root.style.maxHeight = dims.maxHeight ? dims.maxHeight + 'px' : '';
    var inset = hostContext.safeAreaInsets;
    if (inset) document.body.style.padding = inset.top + 'px ' + inset.right + 'px ' + inset.bottom + 'px ' + inset.left + 'px';
    // Update in place: re-rendering would drop sort, filter and chart state.
    document.querySelectorAll('button.fullscreen').forEach(syncFullscreenButton);
  }

  function syncFullscreenButton(btn) {
    var modes = hostContext.availableDisplayModes || [];
    btn.hidden = modes.indexOf('fullscreen') < 0;
    btn.textContent = hostContext.displayMode === 'fullscreen' ? 'Exit fullscreen' : 'Fullscreen';
  }

  function cellText(v) {
    if (v === null || v === undefined) return '';
    var s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return s.length > CELL_MAX ? s.slice(0, CELL_MAX - 1) + '\u2026' : s;
  }
  function chipKey(v) { return v === null || v === undefined ? '(null)' : cellText(v); }

  function compare(a, b) {
    if (a === b) return 0;
    if (a === null || a === undefined) return 1;
    if (b === null || b === undefined) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return cellText(a).localeCompare(cellText(b), undefined, { numeric: true });
  }

  function buildTable(columns, initialRows, withDetail) {
    var state = { col: -1, dir: 1, hidden: {} };
    var rows = initialRows;
    var wrap = el('div');
    if (withDetail && columns.length > 4) {
      var picker = el('details', null, 'columns');
      picker.appendChild(el('summary', 'Columns'));
      columns.forEach(function (c, i) {
        var label = el('label');
        var box = document.createElement('input');
        box.type = 'checkbox'; box.checked = true;
        box.addEventListener('change', function () { state.hidden[i] = !box.checked; draw(); });
        label.appendChild(box); label.appendChild(document.createTextNode(' ' + c));
        picker.appendChild(label);
      });
      wrap.appendChild(picker);
    }
    var scroll = el('div', null, 'scroll');
    var table = el('table');
    scroll.appendChild(table);
    wrap.appendChild(scroll);

    function draw() {
      table.textContent = '';
      var visible = columns.map(function (_, i) { return i; }).filter(function (i) { return !state.hidden[i]; });
      var thead = el('thead'); var hr = el('tr');
      visible.forEach(function (i) {
        var th = el('th', columns[i]);
        if (state.col === i) th.setAttribute('aria-sort', state.dir > 0 ? 'ascending' : 'descending');
        th.addEventListener('click', function () {
          state.dir = state.col === i ? -state.dir : 1; state.col = i; draw();
        });
        hr.appendChild(th);
      });
      thead.appendChild(hr); table.appendChild(thead);
      var order = rows.map(function (_, i) { return i; });
      if (state.col >= 0) order.sort(function (x, y) { return state.dir * compare(rows[x][state.col], rows[y][state.col]); });
      var tbody = el('tbody');
      order.forEach(function (r) {
        var row = rows[r];
        var tr = el('tr', null, 'row');
        visible.forEach(function (i) {
          var v = row[i];
          var td = el('td', cellText(v), v === null || v === undefined ? 'null' : '');
          if (v !== null && v !== undefined) td.title = typeof v === 'object' ? JSON.stringify(v) : String(v);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
        if (withDetail) {
          tr.addEventListener('click', function () {
            var next = tr.nextSibling;
            if (next && next.className === 'detail') { next.remove(); return; }
            var obj = {};
            columns.forEach(function (c, i) { if (row[i] !== undefined) obj[c] = row[i]; });
            var dtr = el('tr', null, 'detail'); var td = el('td');
            td.colSpan = visible.length;
            td.appendChild(el('pre', JSON.stringify(obj, null, 2)));
            dtr.appendChild(td);
            tr.parentNode.insertBefore(dtr, tr.nextSibling);
          });
        }
      });
      table.appendChild(tbody);
    }
    draw();
    return { node: wrap, setRows: function (next) { rows = next; draw(); } };
  }

  // One categorical and one numeric column (the shape of `stats <agg> by <field>`).
  function chartColumns(data) {
    if (data.kind !== 'ppl_rows' || data.columns.length !== 2 || data.rows.length === 0) return null;
    var types = (data.meta && data.meta.column_types) || [];
    var numeric = [0, 1].map(function (i) {
      var t = String(types[i] || '').toLowerCase();
      return NUMERIC_TYPES.indexOf(t) >= 0 && data.rows.every(function (r) { return r[i] === null || typeof r[i] === 'number'; });
    });
    if (numeric[0] === numeric[1]) return null;
    return numeric[0] ? { value: 0, label: 1 } : { value: 1, label: 0 };
  }

  function buildChart(data, cols) {
    var wrap = el('div');
    var holder = el('div');
    wrap.appendChild(holder);
    var note = el('div', null, 'muted');
    wrap.appendChild(note);
    function draw(rows) {
      holder.textContent = '';
      var shown = rows.slice(0, CHART_MAX_BARS);
      note.textContent = rows.length > shown.length ? 'Showing the first ' + shown.length + ' of ' + rows.length + ' bars; switch to the table for all rows.' : '';
      var max = 0;
      shown.forEach(function (r) { if (typeof r[cols.value] === 'number' && r[cols.value] > max) max = r[cols.value]; });
      var rowH = 22, labelW = 180, valueW = 90, width = 640, barW = width - labelW - valueW;
      var chart = svg('svg', { 'class': 'chart', viewBox: '0 0 ' + width + ' ' + Math.max(rowH, shown.length * rowH), role: 'img' });
      chart.appendChild(svg('title', {}, data.columns[cols.value] + ' by ' + data.columns[cols.label]));
      shown.forEach(function (r, i) {
        var v = typeof r[cols.value] === 'number' ? r[cols.value] : 0;
        var y = i * rowH;
        var label = chipKey(r[cols.label]);
        chart.appendChild(svg('text', { x: labelW - 6, y: y + 15, 'text-anchor': 'end' }, label.length > 24 ? label.slice(0, 23) + '\u2026' : label));
        var w = max > 0 && v > 0 ? Math.max(1, (v / max) * barW) : 0;
        chart.appendChild(svg('rect', { 'class': 'bar', x: labelW, y: y + 3, width: w, height: rowH - 6, rx: 2 }));
        chart.appendChild(svg('text', { x: labelW + w + 6, y: y + 15 }, cellText(r[cols.value])));
      });
      holder.appendChild(chart);
    }
    return { node: wrap, setRows: draw };
  }

  function chipColumns(data) {
    var out = [];
    if (data.rows.length < 3) return out;
    data.columns.forEach(function (c, i) {
      if (out.length >= CHIP_MAX_COLUMNS || c === '_id' || c === '_score') return;
      var counts = {}, order = [];
      for (var r = 0; r < data.rows.length; r++) {
        var v = data.rows[r][i];
        if (v !== null && typeof v === 'object') return;
        var k = chipKey(v);
        if (!(k in counts)) { counts[k] = 0; order.push(k); if (order.length > CHIP_MAX_VALUES) return; }
        counts[k]++;
      }
      if (order.length >= 2 && order.length < data.rows.length) out.push({ index: i, name: c, values: order, counts: counts });
    });
    return out;
  }

  function buildChips(groups, onChange) {
    var wrap = el('div');
    var filters = {};
    var clear = el('button', 'Clear filters');
    function sync() {
      wrap.querySelectorAll('button.chip').forEach(function (b) {
        b.setAttribute('aria-pressed', filters[b.dataset.col] === b.dataset.value ? 'true' : 'false');
      });
      clear.hidden = Object.keys(filters).length === 0;
      onChange(filters);
    }
    groups.forEach(function (g) {
      var line = el('div', null, 'chips');
      line.appendChild(el('span', g.name, 'name'));
      g.values.forEach(function (v) {
        var chip = el('button', v + ' (' + g.counts[v] + ')', 'chip');
        chip.dataset.col = String(g.index); chip.dataset.value = v;
        chip.addEventListener('click', function () {
          if (filters[g.index] === v) delete filters[g.index]; else filters[g.index] = v;
          sync();
        });
        line.appendChild(chip);
      });
      wrap.appendChild(line);
    });
    clear.addEventListener('click', function () { filters = {}; sync(); });
    clear.hidden = true;
    wrap.appendChild(clear);
    return wrap;
  }

  function header(data) {
    var h = el('header');
    var m = data.meta || {};
    if (data.tool) h.appendChild(el('span', data.tool, 'badge'));
    var title = data.kind === 'ppl_rows' ? 'PPL' : 'Search ' + (m.index || '');
    h.appendChild(el('span', title, 'title'));
    if (data.cluster) h.appendChild(el('span', 'cluster: ' + data.cluster, 'stat'));
    if (m.total !== undefined && m.total !== null)
      h.appendChild(el('span', 'total: ' + m.total + (m.total_relation === 'gte' ? '+' : ''), 'stat'));
    h.appendChild(el('span', 'rows: ' + (data.rows || []).length, 'stat'));
    if (m.took !== undefined && m.took !== null) h.appendChild(el('span', 'took: ' + m.took + ' ms', 'stat'));
    if (m._shards) h.appendChild(el('span', 'shards: ' + m._shards.successful + '/' + m._shards.total, 'stat'));
    if (m.timed_out) h.appendChild(el('span', 'timed out', 'stat'));
    h.appendChild(el('span', null, 'spacer'));
    if (typeof m.dashboards_url === 'string' && /^https?:\/\//i.test(m.dashboards_url)) {
      var link = el('button', 'View in OpenSearch Dashboards', 'deep-link');
      link.title = data.kind === 'search_hits' ? 'Opens the index in Discover; the query DSL is not carried over.' : 'Opens this PPL query in Discover.';
      link.addEventListener('click', function () {
        request('ui/open-link', { url: m.dashboards_url }).then(function (r) {
          if (r && r.isError) link.textContent = 'Host blocked the link';
        }, function () { link.textContent = 'Host could not open the link'; });
      });
      h.appendChild(link);
    }
    var btn = el('button', null, 'fullscreen');
    syncFullscreenButton(btn);
    btn.addEventListener('click', function () {
      var full = hostContext.displayMode === 'fullscreen';
      request('ui/request-display-mode', { mode: full ? 'inline' : 'fullscreen' })
        .then(function (r) { if (r && r.mode) applyHostContext({ displayMode: r.mode }); }, function () {});
    });
    h.appendChild(btn);
    return h;
  }

  function omittedMessage(data, result) {
    switch (data.omitted) {
      case 'too_large':
        var size = typeof data.bytes === 'number' ? ' (' + (data.bytes / 1048576).toFixed(1) + ' MiB)' : '';
        return el('div', 'This result is too large to show here' + size + '; the view limit is 1 MiB. See the text result, or narrow the query.', 'notice');
      case 'unsupported_format':
        return el('div', 'This output format has no table view. Use the jdbc (PPL) or json (search) format to see a table; the text result is unchanged.', 'notice');
      case 'error':
        var text = ((result && result.content) || []).map(function (c) { return c.text || ''; }).join('\n');
        return el('div', text || 'The tool returned an error.', 'notice error');
      default:
        return el('div', 'No table view for this result; see the text result.', 'notice');
    }
  }

  function presentation(data) {
    var frag = document.createDocumentFragment();
    if (typeof data.narrative === 'string' && data.narrative) {
      frag.appendChild(el('div', 'Analysis (written by the assistant)', 'label'));
      frag.appendChild(el('div', data.narrative, 'narrative'));
    }
    var items = Array.isArray(data.suggestions) ? data.suggestions.filter(function (s) { return typeof s === 'string' && s; }).slice(0, 3) : [];
    if (items.length) {
      frag.appendChild(el('div', 'Next', 'label'));
      var pills = el('div', null, 'pills');
      var status = el('span', null, 'muted');
      items.forEach(function (s) {
        var pill = el('button', s, 'pill');
        pill.addEventListener('click', function () {
          pills.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          request('ui/message', { role: 'user', content: [{ type: 'text', text: MESSAGE_PREFIX + s }] })
            .then(function (r) { status.textContent = r && r.isError ? 'Host did not send the message.' : 'Sent.'; },
                  function () { status.textContent = 'Host did not send the message.'; });
        });
        pills.appendChild(pill);
      });
      pills.appendChild(status);
      frag.appendChild(pills);
    }
    return frag;
  }

  function renderResults(data) {
    app.appendChild(header(data));
    var m = data.meta || {};
    if (m.truncated) {
      app.appendChild(el('div', 'Showing ' + data.rows.length + ' of ' + m.row_count + ' rows and ' + data.columns.length + ' of ' + m.column_count + ' columns; the text result has everything.', 'notice'));
    }
    if (data.rows.length === 0) { app.appendChild(el('div', 'No rows.', 'notice')); return; }
    var table = buildTable(data.columns, data.rows, true);
    var cols = chartColumns(data);
    var chart = cols ? buildChart(data, cols) : null;
    var groups = chipColumns(data);
    function apply(filters) {
      var keys = Object.keys(filters);
      var rows = keys.length ? data.rows.filter(function (r) { return keys.every(function (k) { return chipKey(r[k]) === filters[k]; }); }) : data.rows;
      table.setRows(rows);
      if (chart) chart.setRows(rows);
    }
    if (groups.length) app.appendChild(buildChips(groups, apply));
    if (chart) {
      var bar = el('div', null, 'toolbar');
      var showChart = el('button', 'Chart'), showTable = el('button', 'Table');
      function mode(useChart) {
        showChart.setAttribute('aria-pressed', String(useChart));
        showTable.setAttribute('aria-pressed', String(!useChart));
        chart.node.hidden = !useChart; table.node.hidden = useChart;
      }
      showChart.addEventListener('click', function () { mode(true); });
      showTable.addEventListener('click', function () { mode(false); });
      bar.appendChild(showChart); bar.appendChild(showTable);
      app.appendChild(bar);
      app.appendChild(chart.node);
      chart.setRows(data.rows);
      mode(true);
    }
    app.appendChild(table.node);
    (m.aggregations || []).forEach(function (t) {
      app.appendChild(el('h3', 'Aggregation: ' + t.name + (t.truncated ? ' (truncated)' : '')));
      app.appendChild(buildTable(t.columns, t.rows, false).node);
    });
  }

  var lastResult = null;
  function render(result) {
    lastResult = result;
    app.textContent = '';
    var data = result && result.structuredContent;
    if (!data || typeof data !== 'object') {
      var text = ((result && result.content) || []).map(function (c) { return c.text || ''; }).join('\n');
      if (result && result.isError) app.appendChild(el('div', text || 'Tool call failed.', 'notice error'));
      else app.appendChild(el('div', 'No table view for this result; see the text result.', 'notice'));
      return;
    }
    if (data.version !== PAYLOAD_VERSION) {
      app.appendChild(el('div', 'This result uses view format version ' + cellText(data.version) + ', which this view does not support. Update the server and view together; the text result is unchanged.', 'notice'));
      return;
    }
    if (data.omitted) {
      if (data.tool) { var h = el('header'); h.appendChild(el('span', data.tool, 'badge')); app.appendChild(h); }
      app.appendChild(omittedMessage(data, result));
    } else if (!Array.isArray(data.columns) || !Array.isArray(data.rows)) {
      app.appendChild(el('div', 'No table view for this result; see the text result.', 'notice'));
    } else {
      renderResults(data);
    }
    app.appendChild(presentation(data));
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;
    if (msg.id !== undefined && !msg.method) {
      var p = pending[msg.id]; delete pending[msg.id];
      if (p) { if (msg.error) p.reject(msg.error); else p.resolve(msg.result); }
      return;
    }
    switch (msg.method) {
      case 'ui/notifications/tool-input': break;
      case 'ui/notifications/tool-result': render(msg.params); break;
      case 'ui/notifications/host-context-changed': applyHostContext(msg.params); break;
      case 'ui/notifications/tool-cancelled':
        app.textContent = ''; app.appendChild(el('div', 'Tool call cancelled.', 'notice')); break;
      case 'ui/resource-teardown': case 'ping': send({ id: msg.id, result: {} }); break;
      default: if (msg.id !== undefined) send({ id: msg.id, error: { code: -32601, message: 'Method not found' } });
    }
  });

  var lastSize = '';
  var ready = false;
  function reportSize() {
    if (!ready) return;
    var rect = document.body.getBoundingClientRect();
    var w = Math.ceil(rect.width), h = Math.ceil(rect.height);
    if (w + 'x' + h === lastSize) return;
    lastSize = w + 'x' + h;
    notify('ui/notifications/size-changed', { width: w, height: h });
  }
  new ResizeObserver(reportSize).observe(document.body);

  request('ui/initialize', {
    appInfo: { name: 'opensearch-results', version: '2' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    protocolVersion: PROTOCOL_VERSION
  }).then(function (res) {
    applyHostContext((res && res.hostContext) || {});
    notify('ui/notifications/initialized');
    ready = true;
    reportSize();
  }, function (err) {
    app.textContent = ''; app.appendChild(el('div', 'Host handshake failed: ' + (err && err.message), 'notice error'));
  });
})();
</script>
</body>
</html>
