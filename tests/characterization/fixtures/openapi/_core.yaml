# Hand-written stand-in for opensearch-api-specification spec/namespaces/_core.yaml,
# served by the `pinned_openapi` fixture instead of the GitHub copy. It covers the three
# core operation groups tools/tool_generator.py turns into tools (count, explain, msearch)
# with the real paths, methods, parameters and request bodies, plus things it must skip:
# an operation group outside SUPPORTED_OPERATIONS (search) and `$ref` parameters.
# Editing this file changes the generated tools and therefore the goldens.
openapi: 3.1.0
info:
  title: OpenSearch Core API (characterization fixture)
  version: 1.0.0
paths:
  /_count:
    get:
      operationId: count.0
      x-operation-group: count
      x-version-added: '1.0'
      description: Returns number of documents matching a query.
      externalDocs:
        url: https://opensearch.org/docs/latest/api-reference/count/
      parameters:
        - $ref: '#/components/parameters/count___query.ignore_throttled'
        - name: allow_no_indices
          in: query
          description: If `false`, the request returns an error if any wildcard expression, index alias, or `_all` value targets only missing or closed indexes.
          schema:
            type: boolean
        - name: analyze_wildcard
          in: query
          description: If `true`, wildcard and prefix queries are analyzed. This parameter can only be used when the `q` query string parameter is specified.
          schema:
            type: boolean
            default: false
        - name: analyzer
          in: query
          description: Analyzer to use for the query string. This parameter can only be used when the `q` query string parameter is specified.
          schema:
            type: string
        - name: default_operator
          in: query
          description: The default operator for query string query `AND` or `OR`.
          schema:
            type: string
            enum:
              - AND
              - OR
        - name: expand_wildcards
          in: query
          description: Type of index that wildcard patterns can match.
          schema:
            type: string
        - name: ignore_unavailable
          in: query
          description: If `false`, the request returns an error if it targets a missing or closed index.
          schema:
            type: boolean
        - name: min_score
          in: query
          description: Sets the minimum `_score` value that documents must have to be included in the result.
          schema:
            type: number
        - name: preference
          in: query
          description: Specifies the node or shard the operation should be performed on.
          schema:
            type: string
        - name: q
          in: query
          description: Query in the Lucene query string syntax.
          schema:
            type: string
        - name: routing
          in: query
          description: Custom value used to route operations to a specific shard.
          schema:
            type: string
        - name: terminate_after
          in: query
          description: Maximum number of documents to collect for each shard.
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/count'
      responses:
        '200':
          $ref: '#/components/responses/count___200'
    post:
      operationId: count.1
      x-operation-group: count
      x-version-added: '1.0'
      description: Returns number of documents matching a query.
      parameters:
        - name: q
          in: query
          description: Query in the Lucene query string syntax.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/count'
      responses:
        '200':
          $ref: '#/components/responses/count___200'
