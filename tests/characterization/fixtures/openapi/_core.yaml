  /{index}/_explain/{id}:
    get:
      operationId: explain.0
      x-operation-group: explain
      x-version-added: '1.0'
      description: Returns information about why a specific matches (or doesn't match) a query.
      externalDocs:
        url: https://opensearch.org/docs/latest/api-reference/explain/
      parameters:
        - name: id
          in: path
          required: true
          description: Defines the document ID.
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: Index names used to limit the request. Only a single index name can be provided to this parameter.
          schema:
            type: string
        - $ref: '#/components/parameters/explain___query._source'
        - name: analyze_wildcard
          in: query
          description: If `true`, wildcard and prefix queries are analyzed.
          schema:
            type: boolean
            default: false
        - name: analyzer
          in: query
          description: Analyzer to use for the query string. This parameter can only be used when the `q` query string parameter is specified.
          schema:
            type: string
        - name: default_operator
          in: query
          description: The default operator for query string query `AND` or `OR`.
          schema:
            type: string
        - name: lenient
          in: query
          description: If `true`, format-based query failures (such as providing text to a numeric field) in the query string will be ignored.
          schema:
            type: boolean
        - name: preference
          in: query
          description: Specifies the node or shard the operation should be performed on.
          schema:
            type: string
        - name: q
          in: query
          description: Query in the Lucene query string syntax.
          schema:
            type: string
        - name: routing
          in: query
          description: Custom value used to route operations to a specific shard.
          schema:
            type: string
        - name: stored_fields
          in: query
          description: A comma-separated list of stored fields to return in the response.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/explain'
      responses:
        '200':
          $ref: '#/components/responses/explain___200'
    post:
      operationId: explain.1
      x-operation-group: explain
      x-version-added: '1.0'
      description: Returns information about why a specific matches (or doesn't match) a query.
      parameters:
        - name: id
          in: path
          required: true
          description: Defines the document ID.
          schema:
            type: string
        - name: index
          in: path
          required: true
          description: Index names used to limit the request. Only a single index name can be provided to this parameter.
          schema:
            type: string
      requestBody:
